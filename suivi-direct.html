<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Suivi en direct — Phase finale</title>
<style>
  :root{
    /* Palette identique à l'application principale, pour un rendu fidèle des tableaux */
    --primary:#1a2744; --secondary:#2d6a9f; --accent:#e84855;
    --gold:#f0a500; --success:#27ae60; --warning:#e67e22;
    --light:#f4f6fa; --border:#dde3ee; --text:#1a2744; --text-light:#6b7a99;
    --bg:#f4f6f9;
  }
  .bkt-raw-scroll{overflow:auto; -webkit-overflow-scrolling:touch; background:#fff; border-radius:10px; border:1px solid var(--border);}
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:#1e293b; padding-bottom:40px;
  }
  header{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff; padding:18px 16px; text-align:center; position:sticky; top:0; z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header h1{margin:0 0 4px;font-size:1.15rem;}
  header p{margin:0;font-size:.8rem;opacity:.9;}
  #statut-bar{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:8px 12px; font-size:.76rem; color:var(--text-light); background:#fff;
    border-bottom:1px solid var(--border);
  }
  #statut-bar button{
    border:none; background:var(--secondary); color:#fff; padding:4px 10px;
    border-radius:6px; font-size:.72rem; cursor:pointer;
  }
  .conteneur{max-width:1100px;margin:0 auto;padding:14px;}
  .onglets{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .onglet-btn{
    flex:1; min-width:100px; padding:9px 6px; border:1.5px solid var(--border);
    background:#fff; border-radius:8px; font-size:.8rem; font-weight:600;
    color:var(--text-light); cursor:pointer; text-align:center;
  }
  .onglet-btn.active{background:var(--secondary);color:#fff;border-color:var(--secondary);}

  /* ── Arbre de tableau (bracket) ── */
  .bkt-section{margin-bottom:22px;}
  .bkt-section-titre{
    font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    color:var(--primary); margin:0 0 8px 2px; display:flex; align-items:center; gap:6px;
  }
  .bkt-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; padding:26px 2px 14px;}
  .bkt-tree{display:flex; align-items:stretch;}
  .bkt-round{display:flex; flex-direction:column; justify-content:space-around; min-width:195px; padding:0 22px; position:relative;}
  .bkt-round-titre{
    position:absolute; top:-20px; left:22px; right:22px; text-align:center;
    font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-light);
  }
  .bkt-match-wrap{position:relative; padding:7px 0;}
  .bkt-round:not(:last-child) .bkt-match-wrap::after{
    content:''; position:absolute; right:-22px; top:50%; width:22px; height:1.5px; background:#b7c2d4; z-index:1;
  }
  .bkt-round:not(:first-child) .bkt-match-wrap::before{
    content:''; position:absolute; left:-22px; top:50%; width:22px; height:1.5px; background:#b7c2d4; z-index:1;
  }
  .bkt-match{
    border:1.5px solid var(--border); border-radius:7px; overflow:hidden;
    background:#fff; font-size:.72rem; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .bkt-player{
    padding:6px 9px; border-bottom:1px solid var(--border); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .bkt-player:last-child{border-bottom:none;}
  .bkt-player.vainqueur{background:#e8f4fd; font-weight:700; color:#1e40af;}
  .bkt-player.attente{color:#b0b8c4; font-style:italic;}
  .bkt-score{
    text-align:center; font-size:.66rem; font-weight:700; color:var(--text-light);
    padding:3px 0; background:#f8fafc; border-top:1px solid var(--border);
  }

  /* ── Poules de finale ── */
  .ronde{background:#fff; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; overflow:hidden;}
  .ronde-titre{background:#eef2f7; padding:8px 12px; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--primary);}
  .match{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-top:1px solid var(--border); gap:8px;}
  .match:first-child{border-top:none;}
  .joueurs{flex:1;min-width:0;}
  .joueur{font-size:.86rem; padding:3px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .joueur.vainqueur{font-weight:700;color:var(--success);}
  .joueur.attente{color:#b0b8c4;font-style:italic;}
  .score{font-size:.82rem;font-weight:700;color:var(--primary);white-space:nowrap;padding-left:8px;}
  .classement-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px;}
  .classement-table th{background:#eef2f7;font-size:.72rem;text-transform:uppercase;color:var(--text-light);padding:8px;text-align:left;}
  .classement-table td{padding:8px;font-size:.85rem;border-top:1px solid var(--border);}
  .rang-badge{
    display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;
    border-radius:50%;background:var(--secondary);color:#fff;font-size:.7rem;font-weight:700;
  }
  .badge-district{
    display:inline-block;padding:2px 7px;border-radius:6px;background:#eef2f7;
    color:var(--text-light);font-size:.68rem;font-weight:600;
  }
  #msg-erreur{
    text-align:center;padding:40px 20px;color:var(--text-light);font-size:.9rem;
  }
  #msg-erreur .icone{font-size:2.5rem;margin-bottom:10px;}
  .maj-info{text-align:center;font-size:.72rem;color:var(--text-light);margin-top:10px;}
</style>
</head>
<body>

<header>
  <h1 id="titre-tournoi">🏆 Suivi en direct</h1>
  <p id="sous-titre">Chargement…</p>
</header>

<div id="statut-bar">
  <span id="statut-texte">⏳ Connexion…</span>
  <button onclick="rafraichir(true)">🔄 Actualiser</button>
</div>

<div class="conteneur">
  <div id="onglets" class="onglets" style="display:none;"></div>
  <div id="contenu"></div>
  <div id="msg-erreur" style="display:none;">
    <div class="icone">📡</div>
    <p><strong>Impossible de récupérer les données.</strong><br>
    Vérifiez votre connexion internet, ou attendez que l'organisateur active le suivi.</p>
  </div>
  <p class="maj-info" id="maj-info"></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const dbUrl = params.get('db');
let dernierOnglet = '1';
let dernierePayload = null;

function afficherErreur(msg){
  document.getElementById('msg-erreur').style.display = 'block';
  document.getElementById('contenu').innerHTML = '';
  document.getElementById('onglets').style.display = 'none';
  document.getElementById('statut-texte').textContent = msg || '⚠️ Erreur';
}

async function rafraichir(manuel){
  if(!dbUrl){
    afficherErreur('⚠️ Lien invalide — QR code incomplet');
    return;
  }
  if(manuel) document.getElementById('statut-texte').textContent = '⏳ Actualisation…';
  try{
    const resp = await fetch(dbUrl.replace(/\/+$/,'')+'/suivi.json', { cache:'no-store' });
    if(resp.status === 401 || resp.status === 403){
      afficherErreur('⚠️ Accès refusé — vérifiez les règles de sécurité Firebase');
      return;
    }
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    if(data === null){
      document.getElementById('statut-texte').textContent = '⏳ Suivi pas encore activé par l\'organisateur…';
      return;
    }
    dernierePayload = data;
    document.getElementById('msg-erreur').style.display = 'none';
    // Mémorise la position de défilement avant de remplacer le contenu,
    // car la reconstruction du HTML (onglets + tableau) peut sinon
    // remettre la page en haut à chaque actualisation automatique.
    const scrollY = window.scrollY;
    afficherDonnees(data);
    requestAnimationFrame(()=>window.scrollTo(0, scrollY));
    document.getElementById('statut-texte').textContent = '🟢 En direct';
    document.getElementById('maj-info').textContent = 'Dernière mise à jour : '+new Date(data.maj).toLocaleTimeString('fr-FR');
  }catch(e){
    document.getElementById('statut-texte').textContent = '⚠️ Hors ligne — nouvelle tentative…';
  }
}

function afficherDonnees(data){
  document.getElementById('titre-tournoi').textContent = '🏆 '+(data.tournoi||'Tournoi');
  document.getElementById('sous-titre').textContent = data.categorie||'Phase finale';

  const tabs = [];
  if(data.tableaux?.tab1) tabs.push({key:'tab1', label:'Finale 1'});
  if(data.tableaux?.tab2) tabs.push({key:'tab2', label:'Finale 2'});
  if(data.tableaux?.tab3) tabs.push({key:'tab3', label:'Finale 3'});
  if(data.classementFinal) tabs.push({key:'classement', label:'Classement final'});

  const ongletsEl = document.getElementById('onglets');
  if(tabs.length > 1){
    ongletsEl.style.display = 'flex';
    ongletsEl.innerHTML = tabs.map(t=>
      `<button class="onglet-btn${t.key===dernierOnglet?' active':''}" onclick="choisirOnglet('${t.key}')">${t.label}</button>`
    ).join('');
  } else {
    ongletsEl.style.display = 'none';
  }

  if(!tabs.find(t=>t.key===dernierOnglet) && tabs.length) dernierOnglet = tabs[0].key;

  if(dernierOnglet === 'classement'){
    document.getElementById('contenu').innerHTML = rendreClassementFinal(data.classementFinal);
    return;
  }
  const actif = data.tableaux?.[dernierOnglet];
  document.getElementById('contenu').innerHTML = actif ? rendreTableau(actif) : '<p style="text-align:center;color:#94a3b8;">Phase finale pas encore générée.</p>';
}

function rendreClassementFinal(cf){
  if(!cf || (!cf.places1 && !cf.places2 && !cf.places3)) return '<p style="text-align:center;color:#94a3b8;">Classement pas encore disponible.</p>';
  const bloc=(places,titre)=>{
    if(!places) return '';
    const lignes=places.map(r=>`
      <tr>
        <td><span class="rang-badge">${r.place}</span></td>
        <td>${r.nom?escapeHtml(r.nom):'<span style="color:#bbb;">—</span>'}</td>
        <td style="font-size:.78rem;">${r.etab?escapeHtml(r.etab):'—'}</td>
        <td>${r.district?`<span class="badge-district">${escapeHtml(r.district)}</span>`:'—'}</td>
      </tr>`).join('');
    return `<div class="bkt-section">
      <div class="bkt-section-titre">🏆 ${titre}</div>
      <table class="classement-table"><thead><tr><th>Place</th><th>Joueur</th><th>Établissement</th><th>District</th></tr></thead>
      <tbody>${lignes}</tbody></table>
    </div>`;
  };
  return bloc(cf.places1,'Places 1 à 16') + bloc(cf.places2,'Places 17 à 32') + bloc(cf.places3,'Places 33 à 48');
}

function choisirOnglet(key){
  dernierOnglet = key;
  if(dernierePayload) afficherDonnees(dernierePayload);
}

function ligneJoueur(nom, estVainqueur, joue){
  if(!nom) return `<div class="joueur attente">À déterminer</div>`;
  const cls = (joue && estVainqueur) ? 'joueur vainqueur' : 'joueur';
  return `<div class="${cls}">${escapeHtml(nom)}</div>`;
}

function rendreTableau(tableau){
  if(tableau.type === 'poule') return rendrePoule(tableau.data);
  if(tableau.type === 'bracket-html') return rendreBracketHTML(tableau.html);
  return rendreBracketComplet(tableau.data);
}

function rendreBracketHTML(html){
  if(!html) return '<p style="text-align:center;color:#94a3b8;">Phase finale pas encore générée.</p>';
  return `<div class="bkt-raw-scroll">${html}</div>`;
}

// ── Rendu d'un arbre de tableau (colonnes + connecteurs) ──
function rendreColonnesRondes(rounds){
  if(!rounds || !rounds.length) return '';
  const colonnes = rounds.map(round => `
    <div class="bkt-round">
      <div class="bkt-round-titre">${escapeHtml(round.label)}</div>
      ${round.matchs.map(m => `
        <div class="bkt-match-wrap">
          <div class="bkt-match">
            ${ligneJoueurBkt(m.j1, m.vainqueur===m.j1, m.joue)}
            ${ligneJoueurBkt(m.j2, m.vainqueur===m.j2, m.joue)}
            ${m.score ? `<div class="bkt-score">${escapeHtml(m.score)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
  return `<div class="bkt-scroll"><div class="bkt-tree">${colonnes}</div></div>`;
}

function ligneJoueurBkt(nom, estVainqueur, joue){
  if(!nom) return `<div class="bkt-player attente">À déterminer</div>`;
  const cls = (joue && estVainqueur) ? 'bkt-player vainqueur' : 'bkt-player';
  return `<div class="${cls}">${escapeHtml(nom)}</div>`;
}

function rendreBracketComplet(data){
  if(!data || !data.principal) return '<p style="text-align:center;color:#94a3b8;">Aucune donnée.</p>';
  let html = `<div class="bkt-section">
    <div class="bkt-section-titre">🏆 Tableau principal</div>
    ${rendreColonnesRondes(data.principal)}
  </div>`;
  if(data.cons3 && data.cons3.some(r=>r.matchs.some(m=>m.j1||m.j2))){
    html += `<div class="bkt-section">
      <div class="bkt-section-titre">🥉 Match pour la 3e place</div>
      ${rendreColonnesRondes(data.cons3)}
    </div>`;
  }
  if(data.consQF && data.consQF.some(r=>r.matchs.some(m=>m.j1||m.j2))){
    html += `<div class="bkt-section">
      <div class="bkt-section-titre">🏅 Places 5 à 8</div>
      ${rendreColonnesRondes(data.consQF)}
    </div>`;
  }
  if(data.cons8 && data.cons8.some(r=>r.matchs.some(m=>m.j1||m.j2))){
    html += `<div class="bkt-section">
      <div class="bkt-section-titre">🎖️ Places 9 à 16</div>
      ${rendreColonnesRondes(data.cons8)}
    </div>`;
  }
  return html;
}

function rendrePoule(poule){
  if(!poule) return '<p style="text-align:center;color:#94a3b8;">Aucune donnée.</p>';
  let html = '';
  if(poule.classement && poule.classement.length){
    html += `<table class="classement-table"><thead><tr><th>Rang</th><th>Joueur</th><th>V</th><th>D</th></tr></thead><tbody>`;
    html += poule.classement.map(s => `
      <tr><td><span class="rang-badge">${s.rang}</span></td><td>${escapeHtml(s.nom||'—')}</td><td>${s.v??0}</td><td>${s.d??0}</td></tr>
    `).join('');
    html += `</tbody></table>`;
  }
  if(poule.matchs && poule.matchs.length){
    html += `<div class="ronde"><div class="ronde-titre">Matchs</div>`;
    html += poule.matchs.map(m => `
      <div class="match">
        <div class="joueurs">
          ${ligneJoueur(m.j1, false, m.joue)}
          ${ligneJoueur(m.j2, false, m.joue)}
        </div>
        ${m.score ? `<div class="score">${escapeHtml(m.score)}</div>` : ''}
      </div>
    `).join('');
    html += `</div>`;
  }
  return html || '<p style="text-align:center;color:#94a3b8;">Aucune donnée.</p>';
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

rafraichir(false);
setInterval(()=>rafraichir(false), 6000);
</script>
</body>
</html>
